[platformio]
default_envs = cortadora

; Perfil unico: firmware utilizado en las pruebas del trabajo de grado.
[env:cortadora]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; time: hora en cada linea. log2file: guarda cada sesion del monitor en logs/.
monitor_filters = send_on_enter, time, log2file
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
